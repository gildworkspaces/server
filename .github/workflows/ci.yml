# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION. Every cargo build/test/check
# runs with RUSTC_WRAPPER=sccache; a missing sccache fails the job.
# Backend: R2 (secrets on the public-ci environment) with GHA cache as the
# pre-secrets fallback. sccache itself is mandatory in both.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    environment: public-ci
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: sccache must be present and configured
        run: |
          command -v sccache
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            [ -n "$SCCACHE_BUCKET" ] && [ -n "$SCCACHE_ENDPOINT" ]
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi
          sccache --show-stats
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked --all-targets
      - run: sccache --show-stats
